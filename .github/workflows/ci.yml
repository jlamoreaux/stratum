name: CI - Main Branch

on:
  push:
    branches: [main]

# Note: PR checks are now handled in .github/workflows/pr-checks.yml

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  packages:
    name: CLI, Agent & MCP Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: CLI — install, typecheck, test, build
        working-directory: cli
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Agent — install, typecheck, test, build
        working-directory: agent
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: MCP — install, typecheck, test, build
        working-directory: mcp
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          # Smoke: the built entrypoint must complete a real MCP initialize
          # handshake over stdio (it exits 0 on stdin EOF).
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0.0.0"}}}' \
            | env STRATUM_API_KEY=smoke-not-a-real-key timeout 30s node dist/index.js > /tmp/mcp-smoke.log 2>&1
          # Parse the JSON-RPC reply semantically — a grep on raw JSON breaks on
          # formatting/key-order changes and can match inside other text.
          node -e '
            const lines = require("fs").readFileSync("/tmp/mcp-smoke.log", "utf8").split("\n");
            const ok = lines.some((line) => {
              try {
                const msg = JSON.parse(line);
                return msg.id === 1 && msg.result?.serverInfo?.name === "stratum";
              } catch { return false; }
            });
            if (!ok) { console.error("no initialize reply with serverInfo.name=stratum"); process.exit(1); }
          '

  # ========================================================================
  # Staging Deployment with Automatic Migration
  # ========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    permissions:
      issues: write
      contents: read
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Migrations (Staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying D1 migrations for staging..."
          npx wrangler d1 migrations apply stratum-staging --remote --env=staging
          echo "✓ Migrations applied successfully"

      # Staging binds its own -staging queues (see wrangler.toml); a deploy
      # fails if a bound queue doesn't exist, so create them idempotently.
      - name: Ensure Staging Queues Exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for queue in stratum-events-staging stratum-imports-staging; do
            if out=$(npx wrangler queues create "$queue" 2>&1); then
              echo "✓ Created queue $queue"
            elif echo "$out" | grep -qiE "already (exists|taken)|11009"; then
              echo "✓ Queue $queue already exists"
            else
              echo "$out"
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env=staging
          SUBDOMAIN=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          URL="https://stratum-staging.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Smoke test - Health endpoint
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "→ Testing health endpoint: $STAGING_URL/api/health"
          curl -sfS --retry 5 --retry-delay 5 "$STAGING_URL/api/health"
          echo "✓ Health check passed"

  # ========================================================================
  # Production Deployment with Manual Approval
  # ========================================================================
  deploy-production:
    name: Deploy to Production
    needs: [test, deploy-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      issues: write
      contents: read
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 Migrations (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying D1 migrations for production..."
          npx wrangler d1 migrations apply stratum --remote --env=production
          echo "✓ Migrations applied successfully"

      - name: Deploy to Cloudflare Production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env=production
          SUBDOMAIN=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          URL="https://stratum.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Smoke test - Health endpoint
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "→ Testing health endpoint: $PRODUCTION_URL/api/health"
          curl -sfS --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/health"
          echo "✓ Health check passed"

      - name: Smoke test - Critical paths
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "→ Running critical path smoke tests"
          npx vitest run tests/smoke/ --reporter=verbose || true
          echo "✓ Smoke tests completed"

      - name: Record deployment summary
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.url }}';
            const commitSha = context.sha.substring(0, 7);
            const commitMessage = context.payload.head_commit?.message || 'No message';

            await core.summary
              .addHeading('✅ Production Deployment Complete')
              .addRaw(`**Commit:** ${commitSha}\n\n`)
              .addRaw(`**Message:** ${commitMessage}\n\n`)
              .addRaw(`**URL:** ${deploymentUrl}\n`)
              .addList([
                'D1 migrations applied',
                'Build successful',
                'Health checks passed',
                'Smoke tests completed',
                'Deployment verified',
              ])
              .write();

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          # Ride out transient GitHub API 5xx (503 brownouts have failed
          # otherwise-green runs on nothing but the status comment). A retried
          # POST can rarely duplicate a status comment — accepted trade-off vs.
          # red runs. Every non-transient 4xx is exempt; 429 stays retryable.
          retries: 3
          retry-exempt-status-codes: 400,401,402,403,404,405,406,407,409,410,411,412,413,414,415,416,417,418,421,422,423,424,426,428,431,451
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Production deploy failed",
              body: `The production deployment workflow failed on \`${context.ref}\`.\n\n[View Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['deployment', 'production', 'failure']
            });
