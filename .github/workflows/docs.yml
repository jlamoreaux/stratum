name: Docs Site

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Deploy Docs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: website
        run: npm ci

      # The published guide and reference pages are generated from docs/ by
      # scripts/mirror-docs.mjs. Nothing regenerates them at build time, so a
      # change to docs/ that was not mirrored would otherwise deploy silently
      # stale pages.
      - name: Check the docs mirrors are current
        working-directory: website
        run: npm run check:guides

      - name: Build
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
