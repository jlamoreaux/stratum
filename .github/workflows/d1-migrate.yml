name: D1 Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to migrate"
        required: true
        type: choice
        options:
          - staging
          - production
      database_name:
        description: "D1 database name (defaults: stratum for production, stratum-staging for staging)"
        required: false
        type: string

jobs:
  migrate:
    name: Apply D1 Migrations
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV="${{ github.event.inputs.environment }}"
          DB_NAME="${{ github.event.inputs.database_name }}"

          if [ -z "$DB_NAME" ]; then
            if [ "$ENV" = "production" ]; then
              DB_NAME="stratum"
            else
              DB_NAME="stratum-staging"
            fi
          fi

          echo "Applying migrations for environment=$ENV database=$DB_NAME"
          npx wrangler d1 migrations apply "$DB_NAME" --remote --env="$ENV"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          # Ride out transient GitHub API 5xx (503 brownouts have failed
          # otherwise-green runs on nothing but the status comment). A retried
          # POST can rarely duplicate a status comment — accepted trade-off vs.
          # red runs. Every non-transient 4xx is exempt; 429 stays retryable.
          retries: 3
          retry-exempt-status-codes: 400,401,402,403,404,405,406,407,409,410,411,412,413,414,415,416,417,418,421,422,423,424,426,428,431,451
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 D1 migration failed on ${{ github.event.inputs.environment }}",
              body: `The D1 migration workflow failed for the \`${{ github.event.inputs.environment }}\` environment.\n\n[View run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });
